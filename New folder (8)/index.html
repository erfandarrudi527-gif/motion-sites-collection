<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIVR · Fluid Asset Streams</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- فایل CSS سفارشی -->
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <!-- ==================== MAIN ==================== -->
    <main class="main-container">
        
        <!-- ==================== HERO ==================== -->
        <div class="hero-wrapper">
            <section class="hero-section">
                
                <!-- ویدئوی پس‌زمینه -->
                <video
                    autoplay
                    muted
                    loop
                    playsinline
                    class="video-bg"
                    src="./hf_20260428_193507_4286c423-2fd9-4efd-92bd-91a939453fc1.mp4"
                ></video>

                <!-- لایه محتوا -->
                <div class="content-layer">
                    
                    <!-- ===== NAVBAR ===== -->
                    <nav class="navbar">
                        <!-- اسپیس خالی سمت چپ (برای وسط‌چین) -->
                        <div class="nav-spacer"></div>
                        
                        <!-- منوی وسط (دسکتاپ) -->
                        <ul class="nav-menu">
                            <li class="nav-item">Ecosystem</li>
                            <li class="nav-item dropdown">
                                Economics
                                <i class="fas fa-chevron-right dropdown-icon"></i>
                            </li>
                            <li class="nav-item">Developers</li>
                            <li class="nav-item dropdown">
                                Governance
                                <i class="fas fa-chevron-right dropdown-icon"></i>
                            </li>
                        </ul>
                        
                        <!-- لوگوی موبایل -->
                        <div class="mobile-logo">RIVR</div>
                        
                        <!-- دکمه راست -->
                        <div class="nav-right">
                            <button class="demo-btn">
                                <div class="icon-wrapper">
                                    <i class="fas fa-arrow-up-right demo-icon"></i>
                                </div>
                                <span class="demo-text">Book Demo</span>
                            </button>
                        </div>
                    </nav>

                    <!-- ===== متن اصلی ===== -->
                    <div class="text-container">
                        <!-- Hero Badge -->
                        <div class="hero-badge">
                            <i class="fas fa-sparkles badge-icon"></i>
                            <span class="badge-text">Fluid Staking</span>
                        </div>
                        
                        <!-- تایتل -->
                        <h1 class="hero-title">
                            Fluid Asset Streams
                        </h1>
                        
                        <!-- زیرنویس -->
                        <p class="hero-subtitle">
                            Access Smart Vaults, stake RIVR, NFTs, transform rigid holdings into liquid cash instantly.
                        </p>
                    </div>

                    <!-- ===== کارت پایین چپ ===== -->
                    <div class="bottom-left-card">
                        <div class="stats-block">
                            <span class="stats-number">5.2K</span>
                            <span class="stats-label">Active Yielders</span>
                        </div>
                        <button class="discord-btn">
                            <div class="discord-icon-wrapper">
                                <i class="fas fa-arrow-up-right"></i>
                            </div>
                            <span class="discord-text">Join Discord</span>
                        </button>
                    </div>

                    <!-- ===== گوشه پایین راست ===== -->
                    <div class="bottom-right-corner">
                        <!-- ماسک بالا -->
                        <div class="mask-top">
                            <svg width="100%" height="100%" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M56 56V0C56 30.9279 30.9279 56 0 56H56Z" fill="#f0f0f0"/>
                            </svg>
                        </div>
                        <!-- ماسک چپ -->
                        <div class="mask-left">
                            <svg width="100%" height="100%" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M56 56H0C30.9279 56 56 30.9279 56 0V56Z" fill="#f0f0f0"/>
                            </svg>
                        </div>
                        
                        <!-- محتوای گوشه -->
                        <div class="corner-content">
                            <div class="corner-icon">
                                <i class="fas fa-arrow-up-right"></i>
                            </div>
                            <div class="corner-info">
                                <div class="corner-title">Documentation</div>
                                <div class="corner-link">
                                    <span>Library</span>
                                    <i class="fas fa-chevron-right"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </div>
        
    </main>

    <script src="./app.js"></script>
</body>
</html>
